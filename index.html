<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOM-Genius Surveyor</title>
<meta name="description" content="Offline site survey, Wonderware/AVEVA SCADA BOM estimator and risk analyzer.">
<meta name="theme-color" content="#0b1d2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOM-Genius">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="stack">
<header class="top">
  <div class="brand"><img src="favicon.svg" alt="" width="34" height="34"><div><b>BOM-Genius Surveyor</b><small>Al Gurg Automation &amp; Controls &middot; Dubai</small></div></div>
  <div class="top-r">
    <span id="saveState" class="pill">Ready</span>
    <span id="netState" class="pill ok">Online</span>
    <span id="storState" class="pill">Storage</span>
    <button id="helpBtn" class="btn sm ghost" aria-label="Help">? Help</button>
    <button id="settingsBtn" class="btn sm ghost" aria-label="Settings">&#9881; Settings</button>
    <button id="installBtn" class="btn sm" hidden>Install App</button>
    <button id="themeBtn" class="btn sm ghost" aria-label="Toggle theme">Sunlight mode</button>
  </div>
</header>
<nav class="tabs" id="tabs" role="tablist"><button data-tab="survey" class="on"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h6"/></svg><span>Survey</span></button><button data-tab="bom"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="2" cy="6" r=".5"/></svg><span>BOM</span></button><button data-tab="risk"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg><span>Risk</span></button><button data-tab="vault"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span>Vault</span></button><button data-tab="pwa"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 18v.5"/></svg><span>PWA</span></button></nav>
<div id="ribbon" class="ribbon" aria-live="polite"></div>
</div>
<main>
  <section id="tab-survey" class="panel"></section>
  <section id="tab-bom" class="panel" hidden></section>
  <section id="tab-risk" class="panel" hidden></section>
  <section id="tab-vault" class="panel" hidden></section>
  <section id="tab-pwa" class="panel" hidden></section>
</main>
<footer class="foot">BOM-Genius Surveyor &middot; 100% offline &middot; unit prices are editable placeholders, not quotations.</footer>
<div id="printArea"></div>
<div id="toast" role="status"></div>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('SW failed',e)})})}
</script>
<script src="js/app.js"></script>
</body>
</html>
